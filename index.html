<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supervision Régulation - Besançon</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet-Geoman CSS -->
    <link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.css" />

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="map"></div>

    <!-- Panneau HUD Régulateur -->
    <div class="hud-panel">
        <div class="hud-title">
            <div class="pulse"></div>
            Impact Manifestation Live
        </div>

        <div class="status-picker">
            <button class="btn-color active" style="background: #ff3b30;" title="Axe bloqué / Tête de cortège"
                onclick="setDrawColor('#ff3b30', this)"></button>
            <button class="btn-color" style="background: #ff9500;" title="Ralentissement / Risque fort"
                onclick="setDrawColor('#ff9500', this)"></button>
            <button class="btn-color" style="background: #34c759;" title="Axe libéré"
                onclick="setDrawColor('#34c759', this)"></button>
        </div>

        <button class="btn-action" onclick="exportSituation()">Exporter la situation (JSON)</button>
        <button class="btn-action btn-danger" onclick="clearAllShapes()">Effacer tous les tracés</button>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Leaflet-Geoman JS -->
    <script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.min.js"></script>

    <script src="app.js"></script>
</body>

</html>
