<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supervision Régulation - Besançon</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet-Geoman CSS -->
    <link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.css" />

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="map"></div>

    <!-- Panneau HUD Régulateur -->
    <div class="hud-panel">
        <div class="hud-title">
            <div class="pulse"></div>
            Cortège Live
        </div>

        <div class="hud-status-badge">
            <span class="badge-dot"></span>
            Tracé rouge cortège
        </div>

        <!-- Boutons Tout cocher / Tout décocher les lignes TC -->
        <div class="hud-buttons-row">
            <button class="btn-action btn-sm" onclick="toggleAllLines(true)" title="Afficher toutes les lignes TC">Tout cocher</button>
            <button class="btn-action btn-sm" onclick="toggleAllLines(false)" title="Masquer toutes les lignes TC">Tout décocher</button>
        </div>

        <button class="btn-action" onclick="exportSituation()">Exporter la situation (JSON)</button>
        <button class="btn-action btn-danger" onclick="clearAllShapes()">Effacer les tracés</button>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Leaflet-Geoman JS -->
    <script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.min.js"></script>

    <script src="app.js"></script>
</body>

</html>
