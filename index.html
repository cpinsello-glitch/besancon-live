<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supervision Régulation - Besançon</title>

    <!-- Google Fonts : Roboto -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet-Geoman CSS -->
    <link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.css" />

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="map"></div>

    <!-- 🍎 BARRE DU HAUT STYLE APPLE (DOCK DES LIGNES) -->
    <header id="top-dock" class="top-dock">
        <!-- Carrés des lignes TC générés dynamiquement par app.js -->
        <div id="dock-lines" class="dock-lines"></div>

        <!-- Carré Crayon (Modes de tracé & suppression) -->
        <div class="dock-item dock-draw-tool" id="dock-draw-tool">
            <button type="button" class="dock-btn btn-pencil" id="btn-pencil" title="Outils de tracé">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path>
                </svg>
            </button>
            <div class="dock-submenu submenu-pencil">
                <div class="submenu-title">Tracé d'impact (10px)</div>
                <label class="draw-mode-option" onclick="setDrawMode('cortege')">
                    <input type="radio" name="draw-mode" id="radio-cortege" checked>
                    <span class="mode-preview preview-cortege"></span>
                    <span class="mode-label">Cortège (Rouge 10px)</span>
                </label>
                <label class="draw-mode-option" onclick="setDrawMode('travaux')">
                    <input type="radio" name="draw-mode" id="radio-travaux">
                    <span class="mode-preview preview-travaux"></span>
                    <span class="mode-label">Travaux (Noir/Jaune 10px)</span>
                </label>
                <div class="submenu-divider"></div>
                <button type="button" class="btn-clear-shapes" onclick="clearAllShapes()">
                    🗑️ Effacer les tracés
                </button>
            </div>
        </div>
    </header>

    <!-- 🌍 SÉLECTEUR DE CARTE EN BAS À GAUCHE (STANDART / ÉPURÉ) -->
    <div class="bottom-basemap-switcher">
        <button type="button" class="basemap-tile-btn" id="btn-bm-standard" onclick="setBasemap('standard')">
            <span class="bm-preview bm-preview-standard"></span>
            <span class="bm-label">STANDART</span>
        </button>
        <button type="button" class="basemap-tile-btn active" id="btn-bm-epure" onclick="setBasemap('epure')">
            <span class="bm-preview bm-preview-epure"></span>
            <span class="bm-label">ÉPURÉ</span>
        </button>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Leaflet-Geoman JS -->
    <script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.min.js"></script>

    <script src="app.js"></script>
</body>

</html>
