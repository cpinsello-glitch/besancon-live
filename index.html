<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supervision Régulation - Besançon</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet-Geoman CSS -->
    <link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.css" />

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="map"></div>

    <!-- Panneau HUD Régulateur -->
    <div class="hud-panel">
        <div class="hud-title">
            <div class="pulse"></div>
            Supervision Live
        </div>

        <!-- Sélecteur de mode de tracé : Cortège / Travaux -->
        <div class="hud-mode-selector">
            <button class="btn-mode active" id="btn-mode-cortege" onclick="setDrawMode('cortege')">
                <span class="mode-dot dot-cortege"></span> 🔴 Cortège (10px)
            </button>
            <button class="btn-mode" id="btn-mode-travaux" onclick="setDrawMode('travaux')">
                <span class="mode-dot dot-travaux"></span> 🚧 Travaux (10px)
            </button>
        </div>

        <button class="btn-action btn-danger" onclick="clearAllShapes()">Effacer les tracés</button>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Leaflet-Geoman JS -->
    <script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.min.js"></script>

    <script src="app.js"></script>
</body>

</html>
