<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supervision Régulation - Besançon</title>

    <!-- Google Fonts : Roboto -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet-Geoman CSS -->
    <link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.css" />

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="map"></div>

    <!-- 🍎 BARRE DU HAUT STYLE APPLE (DOCK DES LIGNES) -->
    <header id="top-dock" class="top-dock">
        <!-- Carrés des lignes TC générés dynamiquement par app.js -->
        <div id="dock-lines" class="dock-lines"></div>

        <!-- Carré Crayon (Modes de tracé & suppression) -->
        <div class="dock-item dock-draw-tool" id="dock-draw-tool">
            <button type="button" class="dock-btn btn-pencil" id="btn-pencil" title="Outils de tracé">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path>
                </svg>
            </button>
            <div class="dock-submenu submenu-pencil">
                <div class="submenu-title">Tracé d'impact (10px)</div>
                <label class="draw-mode-option" onclick="setDrawMode('cortege')">
                    <input type="radio" name="draw-mode" id="radio-cortege" checked>
                    <span class="mode-preview preview-cortege"></span>
                    <span class="mode-label">Cortège (Rouge 10px)</span>
                </label>
                <label class="draw-mode-option" onclick="setDrawMode('travaux')">
                    <input type="radio" name="draw-mode" id="radio-travaux">
                    <span class="mode-preview preview-travaux"></span>
                    <span class="mode-label">Travaux (Noir/Jaune 10px)</span>
                </label>
                <div class="submenu-divider"></div>
                <button type="button" class="btn-clear-shapes" onclick="clearAllShapes()">
                    🗑️ Effacer les tracés
                </button>
            </div>
        </div>

        <!-- Carré Déviations & Information Client -->
        <div class="dock-item dock-deviation-tool" id="dock-deviation-tool">
            <button type="button" class="dock-btn btn-deviations" id="btn-deviations" title="Zones d'impact & Info Client" onclick="toggleDeviationPanel()">
                <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                    <line x1="12" y1="9" x2="12" y2="13"></line>
                    <line x1="12" y1="17" x2="12.01" y2="17"></line>
                </svg>
            </button>
        </div>
    </header>

    <!-- 📋 PANNEAU LATÉRAL DROIT : ZONES D'IMPACT, DÉVIATIONS & ÉDITION -->
    <aside id="deviation-panel" class="deviation-panel">
        <div class="deviation-panel-header">
            <div class="panel-header-title">
                <span class="panel-icon">⚠️</span>
                <h2 id="panel-title-text">Zones d'impact & Déviations</h2>
            </div>
            <div class="panel-header-actions">
                <button type="button" class="btn-panel-action" id="btn-add-zone" onclick="openZoneEditor()" title="Créer un nouveau secteur d'impact">➕ Nouveau</button>
                <button type="button" class="btn-close-panel" id="btn-close-deviation-panel" onclick="toggleDeviationPanel(false)" title="Fermer le panneau">✕</button>
            </div>
        </div>

        <div class="deviation-panel-body">
            <!-- VUE 1 : CONSULTATION & ACTIVATION OPÉRATIONNELLE -->
            <div id="view-zones-list" class="panel-view-section">
                <div class="zone-selector-box">
                    <div class="section-label-row">
                        <span class="section-label">SÉLECTEUR DE ZONE D'IMPACT</span>
                        <button type="button" class="btn-text-edit" onclick="editCurrentSelectedZone()" title="Modifier la zone active">✏️ Modifier</button>
                    </div>
                    <div id="zones-list" class="zones-list">
                        <!-- Généré dynamiquement -->
                    </div>
                </div>

                <!-- Contenu réactif dès qu'une zone est active (lignes pliées par défaut) -->
                <div id="zone-details-container" class="zone-details-container">
                    <!-- Détails lignes et textes à copier -->
                </div>
            </div>

            <!-- VUE 2 : ÉDITEUR DE ZONE D'IMPACT EN ÉCRITURE -->
            <div id="view-zone-editor" class="panel-view-section" style="display: none;">
                <div class="editor-header-bar">
                    <button type="button" class="btn-back-view" onclick="closeZoneEditor()">← Retour</button>
                    <span class="editor-title" id="editor-title-label">Éditer le secteur</span>
                </div>

                <form id="form-zone-editor" class="form-zone-editor" onsubmit="saveZoneFromEditor(event)">
                    <div class="form-group">
                        <label>Nom du secteur / point d'impact :</label>
                        <input type="text" id="edit-zone-nom" required placeholder="Ex: Secteur Gare Viotte (Parvis bloqué)">
                    </div>

                    <div class="form-group">
                        <label>Description courte :</label>
                        <input type="text" id="edit-zone-desc" placeholder="Ex: Blocage parvis gare, axes fermés">
                    </div>

                    <div class="editor-divider"></div>
                    <div class="editor-subhead-row">
                        <span class="editor-subhead">LIGNES IMPACTÉES PAR CE SECTEUR</span>
                    </div>

                    <!-- Liste dynamique des lignes impactées (chacune avec ses détails spécifiques) -->
                    <div id="editor-lignes-container" class="editor-lignes-container">
                        <!-- Généré dynamiquement -->
                    </div>

                    <!-- Sélecteur pour ajouter une ligne au secteur -->
                    <div class="add-ligne-action-box">
                        <select id="select-add-ligne-choice">
                            <option value="L3">Ligne 3</option>
                            <option value="L5">Ligne 5</option>
                            <option value="L4">Ligne 4</option>
                            <option value="T1">Tram T1</option>
                            <option value="T2">Tram T2</option>
                            <option value="L6">Ligne 6</option>
                            <option value="7">Ligne 7</option>
                            <option value="8">Ligne 8</option>
                            <option value="9">Ligne 9</option>
                            <option value="10">Ligne 10</option>
                            <option value="11">Ligne 11</option>
                            <option value="12">Ligne 12</option>
                            <option value="CITA">Citadelle</option>
                            <option value="PlanB">Plan B</option>
                        </select>
                        <button type="button" class="btn-add-ligne-row" onclick="addLigneToEditor()">
                            ➕ Ajouter cette ligne
                        </button>
                    </div>

                    <div class="form-actions-bar">
                        <button type="submit" class="btn-save-zone">💾 Enregistrer le secteur et ses lignes</button>
                        <button type="button" class="btn-cancel-edit" onclick="closeZoneEditor()">Annuler</button>
                    </div>
                </form>
            </div>
        </div>
    </aside>

    <!-- 🌍 SÉLECTEUR DE CARTE EN BAS À GAUCHE (STANDART / ÉPURÉ) -->
    <div class="bottom-basemap-switcher">
        <button type="button" class="basemap-tile-btn" id="btn-bm-standard" onclick="setBasemap('standard')">
            <span class="bm-preview bm-preview-standard"></span>
            <span class="bm-label">STANDART</span>
        </button>
        <button type="button" class="basemap-tile-btn active" id="btn-bm-epure" onclick="setBasemap('epure')">
            <span class="bm-preview bm-preview-epure"></span>
            <span class="bm-label">ÉPURÉ</span>
        </button>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Leaflet-Geoman JS -->
    <script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.min.js"></script>

    <script src="app.js"></script>
</body>

</html>
